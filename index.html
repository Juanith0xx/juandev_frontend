<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Juan Estay | Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Desarrollador Full Stack en Chile especializado en React, Node.js y PostgreSQL. Diseño plataformas web, integraciones y soluciones empresariales modernas."
    />
    <meta name="author" content="Juan Estay" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Portafolio de Juan Estay" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="Juan Estay | Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Desarrollador Full Stack en Chile especializado en React, Node.js y PostgreSQL. Diseño plataformas web, integraciones y soluciones empresariales modernas."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Juan Estay | Desarrollador Full Stack" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Juan Estay | Desarrollador Full Stack" />
    <meta
      name="twitter:description"
      content="Desarrollador Full Stack en Chile especializado en React, Node.js y PostgreSQL."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-default.png" />

    <link rel="icon" type="image/png" href="/logo-portfolio.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script id="seo-jsonld" type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Juan Estay",
          "url": "%VITE_SITE_URL%",
          "jobTitle": "Desarrollador Full Stack",
          "nationality": {
            "@type": "Country",
            "name": "Chile"
          },
          "knowsAbout": [
            "React",
            "JavaScript",
            "Node.js",
            "Express",
            "PostgreSQL",
            "APIs REST",
            "Integraciones web",
            "Aplicaciones empresariales"
          ]
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Portafolio de Juan Estay",
          "url": "%VITE_SITE_URL%",
          "description": "Desarrollador Full Stack en Chile especializado en React, Node.js y PostgreSQL. Diseño plataformas web, integraciones y soluciones empresariales modernas.",
          "inLanguage": "es-CL"
        }
      ]
    </script>

    <script>
      (() => {
        try {
          const theme = localStorage.getItem("portfolio_theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
          }
        } catch {
          // El tema por defecto permanece en dark.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
